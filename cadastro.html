<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Job - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="cadastro">

    <header>
        <h1>🚀 FIRST JOB</h1>
        <h3>Crie sua conta!</h3>
        <p>Comece sua jornada profissional.</p>
    </header>

    <main>
        <h2>Cadastro</h2>
        <p>Preencha os dados abaixo para criar sua conta.</p>

        <form action="contacriada.html" method="get">
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </p>

            <p>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </p>

            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required minlength="6">
            </p>

            <p>
                <input type="submit" value="CRIAR MINHA CONTA">
            </p>
        </form>

        <hr>

        <p>Já possui uma conta?</p>
        <p style="margin-top: 8px;">
            <a href="index.html">Voltar para o login</a>
        </p>
    </main>

    <footer>
        <p>© 2026 First Job</p>
        <p>Conectando talentos às oportunidades.</p>
    </footer>

</body>

</html>
