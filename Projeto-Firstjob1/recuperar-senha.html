<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="First Job - Recuperar senha">
    <title>First Job - Recuperar Senha</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>FIRST JOB</h1>
        <p>Recupere o acesso à sua conta.</p>
    </header>

    <main>
        <h2>Esqueceu sua senha?</h2>
        <p>Informe o e-mail cadastrado e enviaremos um link de recuperação.</p>

        <div class="aviso">
            Esta é uma demonstração. Em um sistema real, um e-mail seria enviado.
        </div>

        <form action="#" method="post" onsubmit="alert('Se o e-mail existir, você receberá as instruções em breve.'); return false;">
            <p>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </p>

            <p>
                <input type="submit" value="ENVIAR LINK DE RECUPERAÇÃO">
            </p>
        </form>

        <hr>

        <p>
            <a href="index.html">Voltar para o login</a>
        </p>
    </main>

    <footer>
        <p>© 2026 First Job</p>
        <p>Conectando talentos às oportunidades.</p>
    </footer>

</body>

</html>
