<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Angelo Ferreira da Silva">
    <meta name="description" content="First Job - Encontre seu primeiro emprego">
    <title>First Job - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚀 FIRST JOB</h1>
        <p>Conectando talentos às oportunidades.</p>
    </header>

    <main>
        <h2>Bem-vindo de volta!</h2>
        <p>Entre na sua conta para continuar.</p>

        <form action="#" method="post">
            <p>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </p>

            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </p>

            <p style="text-align: left;">
                <input type="checkbox" id="lembrar" name="lembrar">
                <label for="lembrar" style="display: inline;">Lembrar de mim</label>
            </p>

            <p>
                <input type="submit" value="ENTRAR">
            </p>
        </form>

        <p style="margin-top: 12px;">
            <a href="recuperar-senha.html">Esqueceu sua senha?</a>
        </p>

        <hr>

        <h3 style="color: #174ea6; margin-bottom: 8px;">Ainda não tem uma conta?</h3>
        <p>Cadastre-se gratuitamente!</p>
        <p style="margin-top: 10px;">
            <a href="cadastro.html">Criar minha conta</a>
        </p>
    </main>

    <footer>
        <p>© 2026 First Job</p>
        <p>Conectando talentos às oportunidades.</p>
    </footer>

</body>

</html>
